services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_hrms?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production-with-a-secure-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 1
    volumes:
      - hrms_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hrms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hrms_postgres:
  hrms_uploads:
